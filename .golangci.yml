version: "2"

run:
  timeout: 5m
  build-tags:
    - integration

linters:
  default: standard
  enable:
    - errorlint      # where errors.Is/As should be used
    - gocritic       # common anti-patterns
    - gosec          # security problems
    - misspell       # misspellings
    - nilerr         # returning nil where err is non-nil
    - predeclared    # shadowing a predeclared identifier
    - revive         # style and readability
    - unconvert      # needless type conversions
    - usestdlibvars  # where a standard library constant should be used
    - wastedassign   # assignments that are never used

  settings:
    errcheck:
      check-type-assertions: true
    gosec:
      excludes:
        - G204  # running external commands is what this tool is for (kept in internal/runner)
    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: context-as-argument
        - name: error-return
        - name: error-strings
        - name: increment-decrement
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unreachable-code
        - name: redefines-builtin-id

  exclusions:
    rules:
      # Long functions and duplication are fine in tests.
      - path: _test\.go
        linters:
          - gosec
          - gocritic

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/lambdasakura/incus-dev
