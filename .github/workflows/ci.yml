# Lint, unit tests and the release build. None of this needs Incus.
# The integration tests under test/integration/ do, and are not run here.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: go.mod is tidy
        run: go mod tidy -diff

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test with coverage
        run: make cover

  # Builds the release and exercises .goreleaser.yaml, so a broken release
  # configuration is caught here rather than on a tag.
  release-config:
    name: release-config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean

      - uses: actions/upload-artifact@v7
        with:
          name: idev-snapshot
          path: |
            dist/*.tar.gz
            dist/checksums.txt
          retention-days: 7
