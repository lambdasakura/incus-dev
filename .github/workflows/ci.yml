# Lint, unit tests and cross-platform builds. None of this needs Incus.
# The integration tests under test/integration/ do, and are not run here.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: go.mod is tidy
        run: go mod tidy -diff

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test with coverage
        run: make cover

  # The test suite runs Unix commands (sh, sleep) and relies on POSIX file
  # permissions, so it is not run on Windows. The build and vet must pass,
  # which is what keeps the Windows-specific sources compiling.
  windows:
    name: build (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -o idev.exe ./cmd/idev

      - name: Smoke test
        run: |
          ./idev.exe --version
          ./idev.exe --help

  # Builds every release target and exercises .goreleaser.yaml, so a broken
  # release configuration is caught here rather than on a tag.
  cross-build:
    name: cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean

      - uses: actions/upload-artifact@v7
        with:
          name: idev-snapshot
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          retention-days: 7
