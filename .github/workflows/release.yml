# Publishes a GitHub Release with the Linux binaries.
#
#     git tag -a v0.1.0 -m 'v0.1.0' && git push origin v0.1.0
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # A tag does not run the CI workflow, so check here before publishing.
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

  release:
    name: release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      # Needed to create the release and upload its assets.
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser builds the changelog from the history.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
