# Publishes a GitHub Release with the Linux binaries.
#
# Actions are pinned by commit SHA, not by a tag: a tag can be moved to point
# at something else, and the release job holds contents: write. dependabot
# keeps the pins current.
#
#     git tag -a v0.1.0 -m 'v0.1.0' && git push origin v0.1.0
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # A tag does not run the CI workflow, so check here before publishing.
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # golangci-lint is not on the runner, and make lint quietly falls back
      # to gofmt and go vet without it. That fallback does not type-check
      # test/integration/, which only .golangci.yml's build-tags reaches, so a
      # tag could publish a tree whose integration tests do not compile.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version-file: .golangci-lint-version

      # The same tests a developer runs and CI runs, so a tag cannot publish a
      # tree they would have rejected.
      - name: Test
        run: make tidy test

  release:
    name: release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      # Needed to create the release and upload its assets.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser builds the changelog from the history.
          fetch-depth: 0
          # Otherwise the write-scoped token is left in .git/config for every
          # later step, including the third-party action. GoReleaser takes its
          # token from the environment, not from git.
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # Pinned, so the release runs the same GoReleaser the snapshot in CI
          # was checked against.
          version: "2.18.0"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
