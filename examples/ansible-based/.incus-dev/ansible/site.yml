---
# "hosts: dev" matches the host name in the inventory devkit generates.
- name: Provision development environment
  hosts: dev
  gather_facts: true

  tasks:
    - name: Install packages
      ansible.builtin.apt:
        name: "{{ apt_packages }}"
        state: present
        update_cache: true
      when: ansible_facts.os_family == "Debian"

    - name: Configure shell to start in the workspace
      ansible.builtin.copy:
        content: "cd {{ devkit_workspace }}\n"
        dest: /etc/profile.d/workspace.sh
        mode: "0644"
