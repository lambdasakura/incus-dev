# GoReleaser builds the release archives and publishes the GitHub Release.
#
# Try it locally without publishing anything:
#     goreleaser release --snapshot --clean
version: 2

project_name: incus-dev

before:
  hooks:
    - go mod download

builds:
  - id: idev
    main: ./cmd/idev
    binary: idev
    env:
      - CGO_ENABLED=0
    # Linux only: idev talks to a local Incus, and the client refuses a local
    # connection anywhere else (spec 07-implementation.md 7.7). WSL2 runs this
    # same binary -- it is Linux -- so no Windows build is needed for it.
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    # main.version is what `idev --version` reports.
    ldflags:
      - -s -w -X main.version={{ .Version }}
    # Reproducible builds: stamp the commit time, not the build time.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: idev
    # A snapshot is named "edge" rather than after its version, so the edge
    # release's download URL does not change on every push to main. The
    # version, which carries the commit, is still what `idev --version`
    # reports.
    name_template: >-
      {{ .ProjectName }}_{{ if .IsSnapshot }}edge{{ else }}{{ .Version }}{{ end }}_{{ .Os }}_{{ .Arch }}
    formats:
      - tar.gz
    # Unpacking must not scatter idev, the READMEs, docs/ and examples/ into
    # whatever directory the user happened to be in.
    wrap_in_directory: true
    files:
      - README.md
      - README.ja.md
      - LICENSE
      # Whole directories are included recursively; a `**/*` glob would
      # skip the files sitting directly in them.
      - docs/manual
      - docs/troubleshooting.md
      - docs/troubleshooting.ja.md
      - examples
      # docs/manual/07-ai-agents.md tells the reader to copy these, and both
      # READMEs link them. Shipping the instruction without the files sends
      # the user to a directory that is not there.
      - skills

checksum:
  name_template: checksums.txt

snapshot:
  # What a build off main reports for `idev --version`. The commit is in it
  # because a rolling build has no other way to say which code it is, and a
  # bug report against "edge" alone cannot be placed in the history.
  version_template: "edge-{{ .ShortCommit }}"

changelog:
  sort: asc
  use: github
  groups:
    - title: Features
      regexp: '^feat'
      order: 0
    - title: Fixes
      regexp: '^fix'
      order: 1
    - title: Others
      order: 999
  filters:
    exclude:
      - '^chore:'
      - '^ci:'
      - '^docs:'
      - '^test:'

release:
  prerelease: auto
  # GoReleaser creates the release before uploading. Without this, a failed
  # upload leaves a published release whose assets are missing, and re-pushing
  # the tag fails with a 422 on the assets that did land.
  replace_existing_artifacts: true
  footer: |
    ## Installation

    Download the archive for your platform, unpack it, and put `idev` on your
    `PATH`. Verify the download against `checksums.txt` first:

    ```bash
    sha256sum --check --ignore-missing checksums.txt
    ```

    The archive unpacks into a directory of its own, with the manual beside
    the binary: see `docs/manual/01-installation.md` in it for the rest of the
    setup (Incus, and optionally Ansible).
