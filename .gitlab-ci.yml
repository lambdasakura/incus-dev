# Incusを必要としない検証のみを実行する。
# 統合テスト（make test-integration）はIncusが利用可能なランナーで実行する。
default:
  image: golang:1.25

stages:
  - check

lint:
  stage: check
  before_script:
    - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
  script:
    - golangci-lint run ./...

test:
  stage: check
  script:
    - make cover
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
