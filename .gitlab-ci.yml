# lint and the unit tests need no Incus. The integration tests run on a runner
# that has one.
stages:
  - check
  - integration

lint:
  stage: check
  image: golang:1.27
  before_script:
    - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
  script:
    - golangci-lint run ./...

test:
  stage: check
  image: golang:1.27
  script:
    - make cover
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'

# Runs on a runner where Incus is available. Set tags to match your own
# environment. Without incus the tests skip themselves.
integration:
  stage: integration
  image: golang:1.27
  tags:
    - incus
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: manual
      allow_failure: true
  script:
    - make test-integration
